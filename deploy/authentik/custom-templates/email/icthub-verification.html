{% extends "email/base.html" %}
{% load i18n %}
{% block content %}
<tr>
  <td class="content-block">你好 {{ user.username }}，</td>
</tr>
<tr>
  <td class="content-block">请验证此邮箱以完成 ICThub AI Studio 注册。验证成功前，账号不会获得工作台访问权限。</td>
</tr>
<tr>
  <td class="content-block">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" class="btn btn-primary">
      <tbody><tr><td align="center"><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tbody><tr><td><a id="confirm" href="{{ url }}" rel="noopener noreferrer" target="_blank">验证邮箱</a></td></tr></tbody></table></td></tr></tbody>
    </table>
  </td>
</tr>
<tr>
  <td class="content-block">链接将在 {{ expires|timeuntil }} 后失效且只能使用一次。如果你没有注册，请忽略此邮件并联系管理员。</td>
</tr>
{% endblock %}
